{{/* 同一份 Hugo 目录在宽屏移到右侧，窄屏保持正文前的原生折叠目录。 */}}
{{- $headers := findRE "<h[1-6].*?>(.|\n)+?</h[1-6]>" .Content -}}
{{- if ge (len $headers) 1 -}}
<aside class="toc-shell" aria-label="文章目录">
  <details class="toc" {{ if .Param "TocOpen" }}open{{ end }}>
    <summary accesskey="c" title="(Alt + C)">
      <span class="title">{{ i18n "toc" | default "目录" }}</span>
    </summary>
    <div class="inner">{{ .TableOfContents }}</div>
  </details>
</aside>
{{- end -}}
